---
# =============================================================================
# Update YOUR_RHN_USERNAME and YOUR_RHN_PASSWORD before applying
# Apply: oc apply -f subscription-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: subscription-manager
  namespace: openstack
type: Opaque
stringData:
  rhc_auth: '{"login": {"username": "YOUR_RHN_USERNAME", "password": "YOUR_RHN_PASSWORD"}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: redhat-registry
  namespace: openstack
type: Opaque
stringData:
  edpm_container_registry_logins: '{"registry.redhat.io": {"YOUR_RHN_USERNAME": "YOUR_RHN_PASSWORD"}}'
