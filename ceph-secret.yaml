type: Opaque
stringData:
  ceph.conf: |
    # minimal ceph.conf for 3ce85a0c-3407-11f1-a908-00505683d2ca
    [global]
            fsid = 3ce85a0c-3407-11f1-a908-00505683d2ca
            mon_host = [v2:10.10.20.20:3300/0,v1:10.10.20.20:6789/0]
  ceph.client.openstack.keyring: |
    [client.openstack]
            key = AQDz3vZph23tDRAAlb8R7BrsXQvTcV9PgUkzyw==
            caps mgr = "allow *"
            caps mon = "allow r"
            caps osd = "allow class-read object_prefix rbd_children, allow rwx pool=volumes, allow rwx pool=vms, allow rwx pool=images"
