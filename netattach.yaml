apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ctlplane
  namespace: openstack
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "ctlplane",
      "type": "ipvlan",
      "master": "ctlplane",
      "mode": "l2",
      "ipam": {
        "type": "whereabouts",
        "range": "172.16.30.0/24",
        "range_start": "172.16.30.30",
        "range_end": "172.16.30.70"
      }
    }
---
